[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/list"
  to = "/.netlify/functions/list"
  status = 200

[[redirects]]
  from = "/api/webhook"
  to = "/.netlify/functions/webhook"
  status = 200

[[redirects]]
  from = "/api/pay"
  to = "/.netlify/functions/pay"
  status = 200
